name: Model ML
description: >-
  Model ML is an AI-native platform for financial services that embeds an
  agentic "finance agent" into the tools professionals already use — Excel,
  PowerPoint, Outlook, its own app, and a firm's internal systems. It automates
  deliverables through Workflows, runs compound-intelligence analysis via Grids,
  performs document review and risk assessment, captures information with a
  Notetaker, and answers questions through Chat and agentic dashboards backed by
  real-time data connections. It targets investment banking, consulting, private
  equity and credit, and asset and wealth management. Model ML is a fintech
  company backed by QED Investors. The company publishes a trust center and a
  security program (ISO/IEC 27001, SOC 2 Type II, GDPR) but does not currently
  expose a public developer API, SDK, or API documentation surface.
